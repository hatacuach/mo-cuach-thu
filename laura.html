<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laura</title>
  <style>
    :root {
      --paper: #f7f3ee;
      --ink: #1d1b1a;
      --line: rgba(29, 27, 26, 0.15);
      --overlay: rgba(247, 243, 243, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .frame {
      width: min(820px, calc(100% - 2rem));
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(29, 27, 26, 0.06);
    }

    nav { margin-bottom: 1.25rem; }

    nav a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible { text-decoration: underline; }

    .image-wrap {
      position: relative;
      width: min(100%, 700px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-description {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      left: 1rem;
      max-height: calc(100% - 2rem);
      overflow: auto;
      margin: 0;
      padding: .9rem 1rem;
      background: var(--overlay);
      color: var(--ink);
      font-size: clamp(.85rem, 1.5vw, 1rem);
      line-height: 1.45;
      text-wrap: pretty;
    }
  </style>
</head>
<body>
  <main class="frame">
    <nav aria-label="Page navigation">
      <a href="index.html">← Flaghouse</a>
    </nav>

    <figure class="image-wrap">
      <img src="LAURA-HOWARD-DROGHEDA.jpg" alt="Laura sits at an imaginary city manager desk in Drogheda, wearing the ċuaċ crochet hat." />
      <figcaption class="image-description">
        Laura sits at a imaginary city manager desk. With an old telephone with a dial pad, she sits talking to an imaginary friend. She wears the ċuaċ, a dome shaped crochet hat. This ċuaċ is made from aran cream coloured wool with a lavender marino thread going through. The lapels are made from two Isosceles triangles with the right angles to the fore. The tension of these forms make the material curl. In the background the text reads <em>help us build the future</em> and Drogheda City Now dot com.
      </figcaption>
    </figure>
  </main>
</body>
</html>
