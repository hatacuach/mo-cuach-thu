<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #222;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            margin: 0;
        }

        .gallery {
            width: 100%;
            max-width: 1000px;
        }

        .card {
            position: relative;
            min-height: clamp(420px, 70vw, 700px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            background-color: #fff;
            background-image: url("gert-lush-cuach.svg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.35);
        }

        .card-content {
            position: relative;
            z-index: 1;
            max-width: 520px;
            padding: 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.82);
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(2px);
        }

        .card-content h2 {
            margin: 0 0 10px;
            font-size: 1.7rem;
        }

        .card-content p {
            color: #444;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Sketch Portfolio</h1>
        <p>Welcome! Here are my live drawings, sketches, and digital art pieces created in real-time.</p>
    </header>

    <main class="gallery">
        <section class="card" aria-label="Real-time Sketch 1">
            <div class="card-content">
                <h2>Real-time Sketch 1</h2>
                <p>A live drawing captured in the moment.</p>
            </div>
        </section>
    </main>
</body>
</html>
