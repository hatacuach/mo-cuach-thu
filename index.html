<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Howard | Art Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');

        * { box-sizing: border-box; }
        :root {
            --ink: #292724;
            --paper: #f7f3ee;
            --accent: #f4c92e;
            --orange: #f39c12;
            --neon-pink: #ff4fc8;
            --neon-orange: #ff8b3d;
            --neon-mix: #ff6e86;
        }
        html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
        body { min-height: 100vh; overflow: hidden; position: relative; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: url("gert-lush-cuach.svg") center / cover no-repeat; }
        .content { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; pointer-events: none; }
        header { width: min(700px, 100%); padding: 20px 22px; border-radius: 12px; background: rgba(255,255,255,.28); backdrop-filter: blur(1px); }
        h1 { margin: 0 0 10px; font-family: "Parisienne", "Segoe Script", "Bradley Hand", cursive; font-size: clamp(3rem, 7vw, 6rem); line-height: 1; letter-spacing: 0.02em; font-weight: 400; }
        p { margin: 0; color: rgba(34,34,34,.8); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.5; }
        .music-link {
            position: fixed;
            left: clamp(1.25rem, 8vw, 8rem);
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            color: rgba(34,34,34,.8);
            font-size: clamp(.95rem, 1.5vw, 1.15rem);
            font-weight: 600;
            letter-spacing: .08em;
            text-decoration: none;
            transform: rotate(-4deg);
            transition: color .25s ease, transform .25s ease, text-shadow .25s ease;
            pointer-events: auto;
        }
        .piano-link { top: clamp(15rem, 36vh, 25rem); }
        .ukulele-link { top: calc(clamp(15rem, 36vh, 25rem) + 2.35rem); transform: rotate(3deg); }
        .design-link { top: calc(clamp(15rem, 36vh, 25rem) + 4.7rem); transform: rotate(-2deg); }
        .music-link::before { content: "✦"; color: var(--neon-mix); font-size: .8em; opacity: .85; transition: transform .25s ease; }
        .music-link::after { content: ""; position: absolute; left: 1.25rem; right: -.35rem; bottom: -.35rem; height: 1px; background: var(--neon-mix); opacity: .5; transform: scaleX(.35); transform-origin: left; transition: opacity .25s ease, transform .25s ease; }
        .music-link:hover, .music-link:focus-visible { color: var(--ink); transform: rotate(0deg) translateY(-2px); text-shadow: 0 0 10px rgba(255,110,134,.45); outline: none; }
        .music-link:hover::before, .music-link:focus-visible::before { transform: rotate(25deg) scale(1.2); }
        .music-link:hover::after, .music-link:focus-visible::after { opacity: .9; transform: scaleX(1); }
        .beanie-art { position: fixed; top: clamp(6rem, 15vh, 10rem); right: clamp(1.5rem, 10vw, 10rem); z-index: 2; width: clamp(120px, 15vw, 190px); height: auto; pointer-events: none; filter: drop-shadow(0 12px 10px rgba(25, 45, 27, .2)); animation: beanie-float 6s ease-in-out infinite; }
        .beanie-knit { fill: #174b2d; stroke: #0d2e1b; stroke-width: 3; stroke-linejoin: round; }
        .beanie-highlight { fill: none; stroke: #347249; stroke-width: 4; stroke-linecap: round; opacity: .75; }
        .beanie-shadow { fill: #0e351f; opacity: .8; }
        .beanie-tassel { fill: #21623a; stroke: #0d2e1b; stroke-width: 2; }
        @keyframes beanie-float { 0%, 100% { transform: translateY(0) rotate(4deg); } 50% { transform: translateY(-12px) rotate(-3deg); } }
        .artwork-hit-area { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .formwork-link { pointer-events: auto; cursor: pointer; outline: none; }
        .formwork-face { fill: rgba(110,110,110,.025); stroke: transparent; stroke-width: 8; vector-effect: non-scaling-stroke; transition: fill .18s ease, stroke .18s ease, filter .18s ease; }
        .formwork-edge { fill: none; stroke: rgba(255,127,85,.28); stroke-width: 18; stroke-linejoin: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 4px rgba(255,94,160,.25)); transition: stroke .18s ease, filter .18s ease; }
        .formwork-link:hover .formwork-face, .formwork-link:focus-visible .formwork-face { fill: rgba(255,99,180,.18); stroke: rgba(255,255,255,.95); filter: drop-shadow(0 0 8px rgba(255,99,180,.9)); }
        .formwork-link:hover .formwork-edge, .formwork-link:focus-visible .formwork-edge { stroke: rgba(255,141,71,.45); filter: drop-shadow(0 0 5px rgba(255,94,160,.4)); }
        .formwork-label { opacity: 0; pointer-events: none; font: 700 24px/1 sans-serif; fill: var(--ink); text-anchor: middle; transition: opacity .18s ease; }
        .formwork-link:hover .formwork-label, .formwork-link:focus-visible .formwork-label { opacity: 1; }
        .discover-outline { fill: none; stroke: var(--neon-pink); stroke-width: 4; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 18 12; opacity: .95; pointer-events: none; animation: outline-drift 3s linear infinite, neon-flicker 5s ease-in-out infinite; }
        .discover-hint { fill: #000; font: 600 16px/1 sans-serif; letter-spacing: .04em; text-anchor: middle; opacity: .86; pointer-events: none; animation: hint-breathe 3.5s ease-in-out infinite; }
        .formwork-link:hover .discover-outline, .formwork-link:focus-visible .discover-outline, .formwork-link:hover .discover-hint, .formwork-link:focus-visible .discover-hint { opacity: 0; animation: none; }
        @keyframes outline-drift { to { stroke-dashoffset: -60; } }
        @keyframes neon-flicker { 0%, 12%, 18%, 42%, 100% { opacity: .95; filter: drop-shadow(0 0 3px var(--neon-pink)) drop-shadow(0 0 10px var(--neon-pink)); } 13%, 16%, 43%, 47% { opacity: .22; filter: none; } }
        @keyframes hint-breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .discover-outline, .discover-hint, .music-link, .beanie-art { animation: none; transition: none; } }
        @media (max-width: 700px) { .formwork-label { font-size: 18px; } .discover-hint { font-size: 13px; } .piano-link { top: 27vh; left: 1.25rem; } .ukulele-link { top: calc(27vh + 2.35rem); left: 1.25rem; } .design-link { top: calc(27vh + 4.7rem); left: 1.25rem; } .beanie-art { top: 7rem; right: 1rem; width: 112px; } }
    </style>
</head>
