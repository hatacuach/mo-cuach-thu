<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f7f3ee;
            color: #222;
        }

        body {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("gert-lush-cuach.svg");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            opacity: 1;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 20px;
        }

        header {
            width: min(700px, 100%);
            text-align: left;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(1px);
            border-radius: 12px;
            padding: 20px 22px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        p {
            margin: 0;
            color: rgba(34, 34, 34, 0.8);
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.5;
        }

        .shape-link {
            position: fixed;
            left: 3vw;
            bottom: 4vh;
            width: clamp(150px, 24vw, 340px);
            height: clamp(120px, 20vw, 260px);
            z-index: 2;
            text-decoration: none;
            border-radius: 48% 52% 42% 58% / 58% 44% 56% 42%;
            background: rgba(120, 120, 120, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
            cursor: pointer;
        }

        .shape-link::after {
            content: "Explore this sketch";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.96);
            padding: 0.65rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            color: #222;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            white-space: nowrap;
            pointer-events: none;
        }

        .shape-link:hover,
        .shape-link:focus-visible {
            background: rgba(120, 120, 120, 0.18);
            transform: scale(1.04);
            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.7),
                0 0 0 8px rgba(70, 70, 70, 0.18),
                inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        .shape-link:hover::after,
        .shape-link:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 700px) {
            .shape-link {
                left: 1vw;
                bottom: 2vh;
                width: 42vw;
                height: 28vw;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <header>
            <h1>My Sketch Portfolio</h1>
            <p>Welcome! Here are my live drawings, sketches, and digital art pieces created in real-time.</p>
        </header>
    </div>

    <a
        class="shape-link"
        href="formwork.html"
        aria-label="Open the gray shape sketch page"
        title="Open the gray shape sketch page"
    ></a>
</body>
</html>
