<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #222;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            margin: 0;
        }
        .gallery {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            width: 100%;
            max-width: 700px;
            margin: 0;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Sketch Portfolio</h1>
        <p>Welcome! Here are my live drawings, sketches, and digital art pieces created in real-time.</p>
    </header>

    <main class="gallery">
        <figure class="card">
            <img src="gert-lush-cuach.svg" alt="Real-time Sketch 1">
        </figure>
    </main>
</body>
</html>
