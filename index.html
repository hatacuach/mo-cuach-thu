<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Howard | Art Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');

        * { box-sizing: border-box; }
        :root {
            --ink: #292724;
            --paper: #f7f3ee;
            --accent: #f4c92e;
            --orange: #f39c12;
            --neon-pink: #ff4fc8;
            --neon-orange: #ff8b3d;
            --neon-mix: #ff6e86;
        }
        html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
        body { min-height: 100vh; overflow: hidden; position: relative; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: url("gert-lush-cuach.svg") center / cover no-repeat; }
        .content { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; pointer-events: none; }
        header { width: min(700px, 100%); padding: 20px 22px; border-radius: 12px; background: rgba(255,255,255,.28); backdrop-filter: blur(1px); }
        h1 { margin: 0 0 10px; font-family: "Parisienne", "Segoe Script", "Bradley Hand", cursive; font-size: clamp(3rem, 7vw, 6rem); line-height: 1; letter-spacing: 0.02em; font-weight: 400; }
        p { margin: 0; color: rgba(34,34,34,.8); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.5; }
        .music-link {
            position: fixed;
            left: clamp(1.25rem, 8vw, 8rem);
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            color: rgba(34,34,34,.8);
            font-size: clamp(.95rem, 1.5vw, 1.15rem);
            font-weight: 600;
            letter-spacing: .08em;
            text-decoration: none;
            transform: rotate(-4deg);
            transition: color .25s ease, transform .25s ease, text-shadow .25s ease;
            pointer-events: auto;
        }
        .piano-link { top: clamp(15rem, 36vh, 25rem); }
        .ukulele-link { top: calc(clamp(15rem, 36vh, 25rem) + 2.35rem); transform: rotate(3deg); }
        .design-link { top: calc(clamp(15rem, 36vh, 25rem) + 4.7rem); transform: rotate(-2deg); }
        .cuac-link { top: calc(clamp(15rem, 36vh, 25rem) + 7.05rem); transform: rotate(2deg); }
        .sounds-link { top: calc(clamp(15rem, 36vh, 25rem) + 9.4rem); transform: rotate(-1deg); }
        .music-link::before { content: "✦"; color: var(--neon-mix); font-size: .8em; opacity: .85; transition: transform .25s ease; }
        .music-link::after { content: ""; position: absolute; left: 1.25rem; right: -.35rem; bottom: -.35rem; height: 1px; background: var(--neon-mix); opacity: .5; transform: scaleX(.35); transition: opacity .25s ease, transform .25s ease; transform-origin: left; }
        .music-link:hover, .music-link:focus-visible { color: var(--ink); transform: rotate(0deg) translateY(-2px); text-shadow: 0 0 10px rgba(255,110,134,.45); outline: none; }
        .music-link:hover::before, .music-link:focus-visible::before { transform: rotate(25deg) scale(1.2); }
        .music-link:hover::after, .music-link:focus-visible::after { opacity: .9; transform: scaleX(1); }
        .artwork-hit-area { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .formwork-link { pointer-events: auto; cursor: pointer; outline: none; }
        .formwork-face { fill: rgba(110,110,110,.025); stroke: transparent; stroke-width: 8; vector-effect: non-scaling-stroke; transition: fill .18s ease, stroke .18s ease, filter .18s ease; }
        .formwork-edge { fill: none; stroke: rgba(255,127,85,.28); stroke-width: 18; stroke-linejoin: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 4px rgba(255,94,160,.25)); }
        .formwork-link:hover .formwork-face, .formwork-link:focus-visible .formwork-face { fill: rgba(255,99,180,.18); stroke: rgba(255,255,255,.95); filter: drop-shadow(0 0 8px rgba(255,99,180,.9)); }
        .formwork-link:hover .formwork-edge, .formwork-link:focus-visible .formwork-edge { stroke: rgba(255,141,71,.45); filter: drop-shadow(0 0 5px rgba(255,94,160,.4)); }
        .formwork-label { opacity: 0; pointer-events: none; font: 700 24px/1 sans-serif; fill: var(--ink); text-anchor: middle; transition: opacity .18s ease; }
        .formwork-link:hover .formwork-label, .formwork-link:focus-visible .formwork-label { opacity: 1; }
        .discover-outline { fill: none; stroke: var(--neon-pink); stroke-width: 4; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 18 12; opacity: .95; pointer-events: none; animation: outline-drift 3s linear infinite; }
        .formwork-link:hover .discover-outline, .formwork-link:focus-visible .discover-outline { opacity: 0; animation: none; }
        @keyframes outline-drift { to { stroke-dashoffset: -60; } }
        @media (prefers-reduced-motion: reduce) { .discover-outline, .music-link { animation: none; transition: none; } }
        @media (max-width: 700px) {
            .formwork-label { font-size: 18px; }
            .piano-link { top: 27vh; left: 1.25rem; }
            .ukulele-link { top: calc(27vh + 2.35rem); left: 1.25rem; }
            .design-link { top: calc(27vh + 4.7rem); left: 1.25rem; }
            .cuac-link { top: calc(27vh + 7.05rem); left: 1.25rem; }
            .sounds-link { top: calc(27vh + 9.4rem); left: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="content"><header><h1>Laura Howard</h1><p>Welcome to the flag house, here are my drawings, sketches as well as real and digital art pieces.</p></header></div>
    <a class="music-link piano-link" href="https://howlaura.bandcamp.com/track/mlins" target="_blank" rel="noopener noreferrer">piano</a>
    <a class="music-link ukulele-link" href="https://howlaura.bandcamp.com/track/0" target="_blank" rel="noopener noreferrer">ukulele</a>
    <a class="music-link design-link" href="https://www.behance.net/howard-laura-ireland" target="_blank" rel="noopener noreferrer">diseño</a>
    <a class="music-link cuac-link" href="formwork.html">ċuaċ</a>
    <a class="music-link sounds-link" href="https://soundcloud.com/howard-laura" target="_blank" rel="noopener noreferrer">sounds</a>

    <svg class="artwork-hit-area" viewBox="0 0 1876.8950121543276 1440" preserveAspectRatio="xMidYMid slice" aria-label="Interactive ĊUAĊ shape">
        <a class="formwork-link" href="formwork.html" aria-label="Open ĊUAĊ page">
            <title>ĊUAĊ: open Formwork</title>
            <g transform="translate(-55.92082320472713 360)">
                <path class="formwork-face" d="M 600 780 L 660 660 L 900 660 L 660 780 Z" />
                <path class="formwork-face" d="M 660 780 L 900 660 L 900 720 L 660 840 Z" />
                <path class="formwork-edge" d="M 600 780 L 660 660 L 900 660 L 660 780 L 660 840 L 900 720 L 900 660" />
                <path class="discover-outline" d="M 600 780 L 660 660 L 900 660 L 900 720 L 660 840 L 660 780 L 600 780 Z" aria-hidden="true" />
                <text class="formwork-label" x="755" y="755">ĊUAĊ</text>
            </g>
        </a>
    </svg>
</body>
</html>
