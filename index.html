<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing Portfolio</title>
    <style>
        * { box-sizing: border-box; }
        :root { --ink: #292724; --paper: #f7f3ee; --accent: #f4c92e; }
        html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
        body { min-height: 100vh; overflow: hidden; position: relative; }
        body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: url("gert-lush-cuach.svg") center / cover no-repeat; }
        .content { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; pointer-events: none; }
        header { width: min(700px, 100%); padding: 20px 22px; border-radius: 12px; background: rgba(255,255,255,.28); backdrop-filter: blur(1px); }
        h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.05; letter-spacing: -.04em; }
        p { margin: 0; color: rgba(34,34,34,.8); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.5; }

        /* This uses the SVG's own 1876.895 × 1440 coordinate system. The original
           formwork geometry is the path at x=600–900, y=660–840 translated by
           (-55.920823, 360), so the overlay follows the real angular edges. */
        .artwork-hit-area { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .formwork-link { pointer-events: auto; cursor: pointer; outline: none; }
        .formwork-face { fill: rgba(110,110,110,.025); stroke: transparent; stroke-width: 8; vector-effect: non-scaling-stroke; transition: fill .18s ease, stroke .18s ease, filter .18s ease; }
        .formwork-edge { fill: none; stroke: transparent; stroke-width: 18; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
        .formwork-link:hover .formwork-face, .formwork-link:focus-visible .formwork-face { fill: rgba(244,201,46,.38); stroke: rgba(255,255,255,.95); filter: drop-shadow(0 0 8px rgba(244,201,46,.9)); }
        .formwork-link:hover .formwork-edge, .formwork-link:focus-visible .formwork-edge { stroke: rgba(244,201,46,.5); }
        .formwork-label { opacity: 0; pointer-events: none; font: 700 24px/1 sans-serif; fill: var(--ink); text-anchor: middle; transition: opacity .18s ease; }
        .formwork-link:hover .formwork-label, .formwork-link:focus-visible .formwork-label { opacity: 1; }
        @media (max-width: 700px) { .formwork-label { font-size: 18px; } }
    </style>
</head>
<body>
    <div class="content"><header><h1>My Sketch Portfolio</h1><p>Welcome! Here are my live drawings, sketches, and digital art pieces created in real-time.</p></header></div>

    <svg class="artwork-hit-area" viewBox="0 0 1876.8950121543276 1440" preserveAspectRatio="xMidYMid slice" aria-label="Interactive formwork shape">
        <a class="formwork-link" href="formwork.html" aria-label="Open Formwork page">
            <title>Build: open Formwork</title>
            <g transform="translate(-55.92082320472713 360)">
                <!-- Exact faces derived from the SVG's lower-left formwork path. -->
                <path class="formwork-face" d="M 600 780 L 660 660 L 900 660 L 660 780 Z" />
                <path class="formwork-face" d="M 660 780 L 900 660 L 900 720 L 660 840 Z" />
                <path class="formwork-edge" d="M 600 780 L 660 660 L 900 660 L 660 780 L 660 840 L 900 720 L 900 660" />
                <text class="formwork-label" x="755" y="755">build</text>
            </g>
        </a>
    </svg>
</body>
</html>
