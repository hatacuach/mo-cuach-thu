<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f7f3ee;
            color: #222;
        }

        body {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("gert-lush-cuach.svg");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            opacity: 1;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 20px;
        }

        header {
            width: min(700px, 100%);
            text-align: left;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(1px);
            border-radius: 12px;
            padding: 20px 22px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        p {
            margin: 0;
            color: rgba(34, 34, 34, 0.8);
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="content">
        <header>
            <h1>My Sketch Portfolio</h1>
            <p>Welcome! Here are my live drawings, sketches, and digital art pieces created in real-time.</p>
        </header>
    </div>
</body>
</html>
