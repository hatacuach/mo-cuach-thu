<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>More about ĊUAĊ</title>
  <style>
    :root {
      --paper: #f7f3ee;
      --ink: #292724;
      --line: rgba(41,39,36,.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 3rem);
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(900px, 100%);
      display: grid;
      place-items: center;
      gap: 1rem;
    }

    .image-wrap {
      width: min(100%, 760px);
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.35);
      border: 1px solid var(--line);
      padding: clamp(1rem, 3vw, 2rem);
    }

    img {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      object-fit: contain;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="image-wrap">
      <img src="cuac-laura-howard-drogheda-hat" alt="Cuac by Laura Howard in Drogheda" />
    </div>
    <a href="formwork.html">← Back to ĊUAĊ study</a>
  </main>
</body>
</html>
