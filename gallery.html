    * { box-sizing: border-box; }

    .nav-links { display: flex; align-items: center; gap: 1.25rem; }
    .nav-links a { font-size: .9rem; letter-spacing: .08em; text-transform: lowercase; }
    .eyebrow { color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 800px; margin: 0 0 1rem; color: #5d7565; font-family: Georgia, serif; font-size: clamp(3.5rem, 10vw, 8rem); font-weight: 400; line-height: .95; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 1.25rem; }
    figure { margin: 0; overflow: hidden; border: 1px solid rgba(41,39,36,.16); background: rgba(255,255,255,.58); box-shadow: 0 10px 30px rgba(41,39,36,.08); }
    figure img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; transition: transform .25s ease; }
    figure:hover img { transform: scale(1.035); }
    figcaption { padding: 1rem; }
    figcaption strong { display: block; margin-bottom: .35rem; font-size: .86rem; letter-spacing: .08em; text-transform: uppercase; }
    figcaption span { color: var(--muted); font-size: .9rem; }
    .back { display: inline-block; margin-top: 3rem; color: var(--ink); font-weight: 700; }
