<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formwork — Sketch Study</title>
  <style>
    * { box-sizing: border-box; }
    :root { --paper: #f7f3ee; --ink: #292724; --muted: #68635d; --line: rgba(41,39,36,.18); --yellow: #f4c92e; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); }
    .page { width: min(1180px, 100%); margin: auto; padding: clamp(1.25rem, 4vw, 4rem); }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: clamp(3rem, 9vw, 8rem); }
    nav a, .back { color: var(--ink); text-decoration: none; font-weight: 700; }
    .eyebrow { margin: 0 0 1rem; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(4rem, 14vw, 11rem); line-height: .8; letter-spacing: -.08em; font-weight: 700; }
    .intro { display: grid; grid-template-columns: 1.3fr .7fr; gap: clamp(2rem, 8vw, 8rem); align-items: end; margin-bottom: clamp(4rem, 10vw, 9rem); }
    .intro p { max-width: 30rem; margin: 0 0 .4rem; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.35rem); line-height: 1.55; }
    .study { min-height: 420px; display: grid; place-items: center; margin-bottom: 2rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; background: rgba(255,255,255,.18); }
    .study svg { width: min(720px, 90%); height: auto; overflow: visible; }
    .study polygon, .study path { fill: rgba(120,120,120,.12); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .study .accent { fill: rgba(244,201,46,.5); }
    .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 2rem; }
    .details div { padding-top: 1rem; border-top: 2px solid var(--ink); }
    .details strong { display: block; margin-bottom: .5rem; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; }
    .details span { color: var(--muted); line-height: 1.5; }
    .back { display: inline-block; margin-top: 2rem; }
    @media (max-width: 700px) { .intro, .details { grid-template-columns: 1fr; } .intro { gap: 2rem; } .study { min-height: 300px; } }
  </style>
</head>
<body>
  <main class="page">
    <nav><a href="index.html">← Portfolio</a><span class="eyebrow">Sketch study 01</span></nav>
    <section class="intro"><div><p class="eyebrow">Formwork</p><h1>ĊUAĊ</h1></div><p>A study of structure, surfaces, and the moment a drawing begins to become a place.</p></section>
    <section class="study" aria-label="Formwork geometric study">
      <svg viewBox="0 0 600 360" role="img" aria-label="Angular formwork drawing">
        <polygon points="110,230 220,90 470,90 350,230" />
        <polygon class="accent" points="110,230 350,230 410,290 170,290" />
        <polygon points="350,230 470,90 470,170 410,290" />
        <path d="M110 230 L220 90 L470 90 L350 230 L350 290" fill="none" />
      </svg>
    </section>
    <section class="details"><div><strong>Focus</strong><span>Geometry and spatial construction</span></div><div><strong>Method</strong><span>Live drawing and digital iteration</span></div><div><strong>Status</strong><span>Ongoing sketchbook study</span></div></section>
    <a class="back" href="index.html">Return to the drawing →</a>
  </main>
</body>
</html>
