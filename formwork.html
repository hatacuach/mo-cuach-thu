<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ĊUAĊ — Study 01</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');

    * { box-sizing: border-box; }
    :root { --paper: #f7f3ee; --ink: #292724; --muted: #68635d; --line: rgba(41,39,36,.18); --yellow: #f4c92e; --orange: #f39c12; --headline-green: #5d7565; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); position: relative; }
    body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: url("graph.svg") center / cover no-repeat; opacity: .24; pointer-events: none; }
    .page { position: relative; z-index: 1; width: min(1180px, 100%); margin: auto; padding: clamp(1.25rem, 4vw, 4rem); }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: clamp(3rem, 9vw, 8rem); }
    nav a, .back { color: var(--ink); text-decoration: none; font-weight: 700; }
    .eyebrow { margin: 0 0 1rem; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; color: var(--headline-green); font-family: "Parisienne", "Segoe Script", "Bradley Hand", cursive; font-size: clamp(4rem, 12vw, 9rem); line-height: 1; letter-spacing: 0; font-weight: 400; opacity: .86; }
    .intro { display: grid; grid-template-columns: 1.3fr .7fr; gap: clamp(2rem, 8vw, 8rem); align-items: end; margin-bottom: clamp(4rem, 10vw, 9rem); }
    .intro p { max-width: 30rem; margin: 0 0 .4rem; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.35rem); line-height: 1.55; }
    .study { display: none; }
    .details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 2rem; }
    .details div { padding-top: 1rem; border-top: 2px solid var(--ink); }
    .details strong { display: block; margin-bottom: .5rem; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; }
    .details span { color: var(--muted); line-height: 1.5; }
    .commission-button { display: inline-block; margin-top: .75rem; padding: .65rem .9rem; border: 1px solid var(--orange); border-radius: 999px; background: rgba(243,156,18,.1); color: var(--ink); text-decoration: none; font-weight: 700; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .commission-button:hover, .commission-button:focus-visible { background: var(--orange); color: #fff; transform: translateY(-2px); }
    .back { display: inline-block; margin-top: 2rem; }
    @media (max-width: 700px) { .intro, .details { grid-template-columns: 1fr; } .intro { gap: 2rem; } }
  </style>
</head>
<body>
  <main class="page">
    <nav><a href="index.html">← Flagship</a><span class="eyebrow">ĊUAĊ study 01</span></nav>
    <section class="intro"><div><h1>ĊUAĊ</h1></div><p>A study of spiral, from bíseach to biseach.</p></section>
    <section class="study" aria-label="ĊUAĊ geometric study">
      <img src="graph.svg" alt="Angular ĊUAĊ drawing" />
    </section>
    <section class="details">
      <div><strong>Focus</strong><span>Geometry and spatial construction</span></div>
      <div><strong>Method</strong><span>Live drawing and digital iteration</span></div>
      <div><strong>Format</strong><span>Original study</span></div>
      <div><strong>Action</strong><a class="commission-button" href="https://docs.google.com/forms/d/e/1FAIpQLScaVocBcgfvOU0_-bpeqDYTWgMlpKdxInKFKGv7GEC0F1zCuw/viewform?usp=dialog" target="_blank" rel="noopener">Commission a piece</a></div>
    </section>
    <a class="back" href="index.html">More about ĊUAĊ →</a>
  </main>
</body>
</html>
